<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Payment complete — Timeline Visualizer</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, system-ui, sans-serif;
        background: #f7fafc;
        color: #1a365d;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
      }
      .card {
        max-width: 28rem;
        background: #fff;
        border-radius: 12px;
        padding: 2rem;
        box-shadow: 0 8px 30px rgba(26, 54, 93, 0.08);
        text-align: center;
      }
      h1 {
        margin: 0 0 0.75rem;
        font-size: 1.25rem;
      }
      p {
        margin: 0;
        line-height: 1.5;
        color: #4a5568;
      }
      a {
        color: #2b6cb0;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1 id="title">Payment complete</h1>
      <p id="status">Returning you to Timeline Visualizer…</p>
    </div>
    <script>
      (function () {
        var MESSAGE_TYPE = 'tv-payment-success';
        var params = new URLSearchParams(window.location.search);
        var exportId = params.get('exportId');
        var sessionId = params.get('session_id')
          || params.get('sessionId')
          || params.get('checkoutSessionId')
          || params.get('checkout_session_id');
        var status = document.getElementById('status');
        var title = document.getElementById('title');

        if (!exportId) {
          title.textContent = 'Payment complete';
          status.innerHTML = 'You can close this window and return to <a href="/">Timeline Visualizer</a>.';
          return;
        }

        var payload = { type: MESSAGE_TYPE, exportId: exportId };
        if (sessionId) payload.sessionId = sessionId;

        if (window.opener && !window.opener.closed) {
          window.opener.postMessage(payload, window.location.origin);
          window.setTimeout(function () {
            window.close();
          }, 300);
          status.textContent = 'Payment complete. This window will close automatically.';
          window.setTimeout(function () {
            if (!window.closed) {
              status.innerHTML = 'You can close this window and download your video on the main page.';
            }
          }, 1200);
          return;
        }

        window.location.replace('/?payment=success&exportId=' + encodeURIComponent(exportId));
      })();
    </script>
  </body>
</html>
