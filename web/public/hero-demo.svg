<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 315" width="560" height="315">
  <defs>
    <linearGradient id="demo-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="560" height="315" rx="16" fill="url(#demo-bg)"/>
  <!-- grid dots -->
  <g fill="#334155" opacity="0.5">
    <circle cx="80" cy="60" r="1.5"/><circle cx="160" cy="60" r="1.5"/><circle cx="240" cy="60" r="1.5"/>
    <circle cx="320" cy="60" r="1.5"/><circle cx="400" cy="60" r="1.5"/><circle cx="480" cy="60" r="1.5"/>
    <circle cx="80" cy="140" r="1.5"/><circle cx="160" cy="140" r="1.5"/><circle cx="240" cy="140" r="1.5"/>
    <circle cx="320" cy="140" r="1.5"/><circle cx="400" cy="140" r="1.5"/><circle cx="480" cy="140" r="1.5"/>
    <circle cx="80" cy="220" r="1.5"/><circle cx="160" cy="220" r="1.5"/><circle cx="240" cy="220" r="1.5"/>
    <circle cx="320" cy="220" r="1.5"/><circle cx="400" cy="220" r="1.5"/><circle cx="480" cy="220" r="1.5"/>
  </g>
  <!-- animated route -->
  <path id="route" d="M90 230 C140 200, 180 120, 260 110 S400 80, 470 140" fill="none" stroke="#f97316" stroke-width="4" stroke-linecap="round"
    stroke-dasharray="420" stroke-dashoffset="420" filter="url(#glow)">
    <animate attributeName="stroke-dashoffset" from="420" to="0" dur="3s" repeatCount="indefinite"/>
  </path>
  <circle cx="90" cy="230" r="7" fill="#fff"/>
  <circle cx="470" cy="140" r="7" fill="#f97316">
    <animate attributeName="r" values="7;9;7" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="28" y="42" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="13" font-weight="600">Travel recap preview</text>
  <text x="28" y="290" fill="#64748b" font-family="system-ui,sans-serif" font-size="11">Animated map · Portrait MP4</text>
</svg>
